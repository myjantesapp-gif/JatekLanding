kind = "web"
previewPath = "/"
title = "JATEK — Livraison à Oujda"
description = "Landing page publique de JATEK, plateforme de livraison marocaine née à Oujda, avec pages légales, confidentialité RGPD et support client."
version = "1.0.0"
id = "artifacts/jatek"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19996

[services.development]
run = "pnpm --filter @workspace/jatek run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jatek", "run", "build" ]
serve = "static"
publicDir = "artifacts/jatek/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19996"
BASE_PATH = "/"
